<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Project Percy - Availability Poll</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 480px; margin: 40px auto; padding: 24px; border: 1px solid #e0e0e0; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { color: #1a73e8; margin-top: 0; }
        .slot-option { display: block; margin: 10px 0; padding: 12px; background: #f8f9fa; border: 1px solid #dadce0; border-radius: 6px; cursor: pointer; }
        .slot-option:hover { background: #f1f3f4; }
        input[type="email"] { width: 100%; padding: 10px; margin: 8px 0 16px 0; border: 1px solid #dadce0; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #1a73e8; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #1557b0; }
        #statusMessage { margin-top: 16px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <h2>Project Percy Scheduling</h2>
    <p>Please select the times that work for your schedule:</p>

    <label for="voterEmail"><strong>Your Email Address:</strong></label>
    <input type="email" id="voterEmail" placeholder="e.g. participant@example.com" required />

    <div id="slotsContainer"></div>

    <button onclick="submitVote()">Submit Availability</button>

    <div id="statusMessage"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const pollId = urlParams.get('poll_id') || 'demo_poll';
        const rawSlots = urlParams.get('slots');
        
        const slots = rawSlots ? rawSlots.split(',') : [
            "2026-11-10 14:00",
            "2026-11-10 16:00",
            "2026-11-11 10:00"
        ];

        const container = document.getElementById('slotsContainer');
        slots.forEach(slot => {
            const label = document.createElement('label');
            label.className = 'slot-option';
            label.innerHTML = `<input type="checkbox" name="selected_slot" value="${slot}"> ${slot}`;
            container.appendChild(label);
        });

        async function submitVote() {
            const email = document.getElementById('voterEmail').value.trim();
            if (!email) {
                alert("Please enter your email address.");
                return;
            }

            const checkedBoxes = document.querySelectorAll('input[name="selected_slot"]:checked');
            const selectedSlots = Array.from(checkedBoxes).map(cb => cb.value);

            if (selectedSlots.length === 0) {
                alert("Please select at least one time slot.");
                return;
            }

            try {
                const response = await fetch(`/api/polls/${pollId}/vote`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        voter_email: email,
                        selected_slots: selectedSlots
                    })
                });

                const result = await response.json();
                
                if (response.ok) {
                    document.getElementById('statusMessage').style.color = 'green';
                    document.getElementById('statusMessage').innerText = "Vote submitted successfully!";
                } else {
                    document.getElementById('statusMessage').style.color = 'red';
                    document.getElementById('statusMessage').innerText = result.detail || "Error submitting vote.";
                }
            } catch (err) {
                document.getElementById('statusMessage').style.color = 'red';
                document.getElementById('statusMessage').innerText = "Failed to connect to backend server.";
            }
        }
    </script>
</body>
</html>
